---
# Common tasks for all hosts
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [always, common, update]

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
  tags: [common, packages, install]

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"
  tags: [common, hostname, configure]

- name: Configure /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ private_ip }} {{ inventory_hostname }}"
    state: present
  tags: [common, network, configure]

- name: Set timezone to UTC
  timezone:
    name: UTC
  tags: [common, timezone, configure]

- name: Disable swap for better performance
  shell: swapoff -a
  changed_when: false
  tags: [common, performance, configure]

---
- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  tags: [docker, configure, users]

- name: Create Docker daemon config directory
  file:
    path: /etc/docker
    state: directory
    mode: '0755'
  tags: [docker, configure, directories]

- name: Configure Docker daemon
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
  notify: restart docker
  tags: [docker, configure, daemon]

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  tags: [docker, configure, service]

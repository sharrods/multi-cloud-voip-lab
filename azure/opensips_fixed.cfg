log_level=3
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
auto_aliases=no
udp_workers=4

socket=udp:10.128.0.4:5060 as 34.172.210.177

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "dialog.so"
loadmodule "mi_fifo.so"
loadmodule "pike.so"
loadmodule "nathelper.so"
loadmodule "proto_udp.so"
loadmodule "rtpengine.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("usrloc", "db_mode", 0)
modparam("registrar", "default_expires", 3600)
modparam("rr", "append_fromtag", 1)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("nathelper", "natping_interval", 30)
modparam("dialog", "default_timeout", 21600)
modparam("tm", "fr_timeout", 30)
modparam("tm", "fr_inv_timeout", 120)

route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply(200, "OK");
        exit;
    }

    if (!pike_check_req()) {
        xlog("L_WARN", "PIKE blocking $si\n");
        exit;
    }

    # ===================================================================
    # IN-DIALOG REQUESTS (has To tag)
    # ===================================================================
    if (has_totag()) {
        # ACK - Special handling (CRITICAL FIX)
        if (is_method("ACK")) {
            xlog("L_INFO", "ACK received from $si\n");
            
            # Try loose routing first
            if (loose_route()) {
                xlog("L_INFO", "ACK - loose_route matched, forwarding\n");
                # Don't call rtpengine for ACK!
                if (!t_relay()) {
                    xlog("L_ERR", "ACK relay failed\n");
                }
                exit;
            } else {
                # ACK for 200 OK when loose_route fails
                # This can happen if dialog state was lost
                xlog("L_WARN", "ACK - loose_route failed, checking transaction\n");
                
                if (t_check_trans()) {
                    # ACK for negative response (absorbed by TM)
                    xlog("L_INFO", "ACK for transaction (negative response)\n");
                    t_relay();
                    exit;
                } else {
                    # ACK for 200 OK but no route match
                    # Try to relay anyway - ACKs must not be dropped!
                    xlog("L_WARN", "ACK - no transaction, attempting relay\n");
                    if (!t_relay()) {
                        xlog("L_ERR", "ACK final relay failed\n");
                    }
                    exit;
                }
            }
        }
        
        # Other in-dialog requests (BYE, re-INVITE, UPDATE, etc.)
        if (loose_route()) {
            xlog("L_INFO", "Sequential request $rm - loose routing\n");
            
            if (is_method("BYE")) {
                xlog("L_INFO", "BYE - deleting RTP session\n");
                rtpengine_delete();
            } else if (is_method("INVITE")) {
                # re-INVITE
                xlog("L_INFO", "re-INVITE - updating media\n");
            }
            
            route(RELAY);
            exit;
        } else {
            # Sequential request without Route header or doesn't match
            xlog("L_WARN", "Sequential request $rm - loose_route failed\n");
            sl_send_reply(404, "Not Here");
            exit;
        }
    }

    # ===================================================================
    # INITIAL REQUESTS (no To tag)
    # ===================================================================
    
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    t_check_trans();

    if (is_method("REGISTER")) {
        xlog("L_INFO", "REGISTER from $fu\n");
        fix_nated_contact();
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE from $fu to $rU\n");
        
        # Add Record-Route for dialog continuity
        record_route();
        
        fix_nated_contact();
        create_dialog();
        
        t_on_failure("1");
        t_on_reply("1");

        # Route to FreeSWITCH based on destination
        if ($rU =~ "^\*9[78]" || $rU =~ "^9[16][0-9]{2}" || $rU =~ "^9888" ||
            $rU =~ "^3[0-9]{3}" || $rU =~ "^5[0-9]{3}") {
            xlog("L_INFO", "Route to FreeSWITCH $rU\n");
            route(TO_FREESWITCH);
            exit;
        }

        # Try registered users first
        if (lookup("location")) {
            xlog("L_INFO", "Route to registered user\n");
            route(RELAY);
            exit;
        }

        # Default to FreeSWITCH
        xlog("L_INFO", "Default route to FreeSWITCH\n");
        route(TO_FREESWITCH);
        exit;
    }

    # Other initial requests
    route(RELAY);
}

route[TO_FREESWITCH] {
    xlog("L_INFO", "Forward to FreeSWITCH: $ru\n");
    $du = "sip:10.128.0.4:5080";
    
    if (has_body("application/sdp")) {
        rtpengine_offer("replace-origin replace-session-connection ICE=remove RTP/AVP internal external");
    }
    
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[RELAY] {
    xlog("L_INFO", "RELAY: $rm from $si to $du\n");
    
    # Only handle RTP for INVITE/UPDATE with SDP
    # NOT for ACK, BYE, etc.
    if (is_method("INVITE|UPDATE") && has_body("application/sdp")) {
        xlog("L_INFO", "RELAY: Engaging RTPEngine\n");
        rtpengine_offer("replace-origin replace-session-connection ICE=remove RTP/AVP internal external");
    }
    
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[1] {
    xlog("L_INFO", "Reply $rs from $si for $rm\n");
    
    if (has_body("application/sdp")) {
        xlog("L_INFO", "Reply has SDP, engaging RTPEngine\n");
        rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP external internal");
    }
}

failure_route[1] {
    xlog("L_WARN", "CALL_FAILURE code=$T_reply_code from=$fu to=$ru callid=$ci\n");
    
    if (t_check_status("403")) {
        xlog("L_WARN", "FAILURE_403_FORBIDDEN from=$fu to=$ru callid=$ci\n");
    } else if (t_check_status("404")) {
        xlog("L_WARN", "FAILURE_404_NOT_FOUND from=$fu to=$ru callid=$ci\n");
    } else if (t_check_status("408")) {
        xlog("L_WARN", "FAILURE_408_TIMEOUT from=$fu to=$ru callid=$ci\n");
    } else if (t_check_status("480")) {
        xlog("L_WARN", "FAILURE_480_UNAVAILABLE from=$fu to=$ru callid=$ci\n");
    } else if (t_check_status("486")) {
        xlog("L_WARN", "FAILURE_486_BUSY from=$fu to=$ru callid=$ci\n");
    } else if (t_check_status("500")) {
        xlog("L_WARN", "FAILURE_500_SERVER_ERROR from=$fu to=$ru callid=$ci\n");
    } else if (t_check_status("503")) {
        xlog("L_WARN", "FAILURE_503_UNAVAILABLE from=$fu to=$ru callid=$ci\n");
    }
}

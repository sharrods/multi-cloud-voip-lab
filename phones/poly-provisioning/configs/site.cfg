<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!--
  Lab-wide settings shared by every Poly phone.
  Per-phone settings (the SIP line) live in <mac-address>.cfg.
-->
<polycomConfig>

  <!-- Time: SNTP server and Denver time zone.
       gmtOffset is in seconds: UTC-7 = -25200. US daylight saving rules. -->
  <tcpIpApp
    tcpIpApp.sntp.address="pool.ntp.org"
    tcpIpApp.sntp.address.overrideDHCP="1"
    tcpIpApp.sntp.gmtOffset="-25200"
    tcpIpApp.sntp.gmtOffset.overrideDHCP="1"
    tcpIpApp.sntp.daylightSavings.enable="1" />

  <!-- NAT keepalive every 20 seconds keeps the home router's mapping open
       so requests from OpenSIPS can reach the phone. -->
  <nat
    nat.keepalive.interval="20" />

  <!-- Keep the phone's own web page turned on. -->
  <httpd
    httpd.enabled="1"
    httpd.cfg.enabled="1" />

</polycomConfig>

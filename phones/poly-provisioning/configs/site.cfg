<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!--
  Lab-wide settings shared by every Poly phone.
  Per-phone settings (the SIP line) live in <mac-address>-lines.cfg.
-->
<polycomConfig>

  <!-- Time: SNTP server and Denver time zone.
       gmtOffset is in seconds: UTC-7 = -25200. US daylight saving rules. -->
  <tcpIpApp
    tcpIpApp.sntp.address="pool.ntp.org"
    tcpIpApp.sntp.address.overrideDHCP="1"
    tcpIpApp.sntp.gmtOffset="-25200"
    tcpIpApp.sntp.gmtOffset.overrideDHCP="1"
    tcpIpApp.sntp.daylightSavings.enable="1" />

  <!-- NAT keepalive every 20 seconds keeps the home router's mapping open
       so requests from OpenSIPS can reach the phone. -->
  <nat
    nat.keepalive.interval="20" />

  <!-- Keep the phone's own web page turned on. -->
  <httpd
    httpd.enabled="1"
    httpd.cfg.enabled="1" />

  <!-- Digit map (lab numbers). The factory map is North American and has no
       pattern starting "10", so typing 1005 was dropped after the 2nd digit.
       1xxx                 = extensions 1000-1999, dial after 4th digit
       9196|9197|9664|9888  = service numbers (match OpenSIPS TO_FREESWITCH)
       3xxx|*97             = service numbers (match OpenSIPS TO_FREESWITCH)
       x.T                  = anything else: dial after a short pause
       x = any digit, | = or, . = repeat, T = timeout -->
  <dialplan
    dialplan.digitmap="1xxx|9196|9197|9664|9888|3xxx|*97|x.T" />

</polycomConfig>

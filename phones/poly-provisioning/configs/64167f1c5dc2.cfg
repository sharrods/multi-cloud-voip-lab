<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!--
  Poly VVX 501, MAC 64:16:7F:1C:5D:C2 (file name = MAC, lowercase, no separators).
  Line 1 = extension 1004 on GCP OpenSIPS.

  How the phone finds OpenSIPS:
    server address voiplab.sharrodskinner.com + port 0 + UDPOnly
    -> DNS SRV lookup _sip._udp.voiplab.sharrodskinner.com
    -> opensips-gcp-uscentral1.voiplab.sharrodskinner.com, port 5060
    -> DNS A lookup -> 34.44.206.214

  Password: placeholder. GCP OpenSIPS does not authenticate registrations yet.
  When authentication is added, the real password is set outside this public repo.
-->
<polycomConfig>

  <reg
    reg.1.address="1004"
    reg.1.label="1004"
    reg.1.displayName="Lab 1004"
    reg.1.auth.userId="1004"
    reg.1.auth.password="NOT_CHECKED_YET"
    reg.1.server.1.address="voiplab.sharrodskinner.com"
    reg.1.server.1.port="0"
    reg.1.server.1.transport="UDPOnly"
    reg.1.server.1.expires="300" />

</polycomConfig>

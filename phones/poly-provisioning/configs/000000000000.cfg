<?xml version="1.0" standalone="yes"?>
<!--
  Master configuration file. Every Poly phone asks for this file first.
  APP_FILE_PATH: firmware. Not served - the phone gets a 404 and keeps 6.4.7.
  CONFIG_FILES: loaded left to right; the LEFT file wins on duplicates, so the
                per-phone file overrides site.cfg. [PHONE_MAC_ADDRESS] is
                replaced by the phone's own lowercase MAC (64167f1c5dc2).
-->
<APPLICATION
  APP_FILE_PATH="sip.ld"
  CONFIG_FILES="[PHONE_MAC_ADDRESS].cfg, site.cfg"
  MISC_FILES=""
  LOG_FILE_DIRECTORY="logs"
  OVERRIDES_DIRECTORY="overrides"
  CONTACTS_DIRECTORY=""
  LICENSE_DIRECTORY=""
  USER_PROFILES_DIRECTORY=""
  CALL_LISTS_DIRECTORY=""
  COREFILE_DIRECTORY="">
</APPLICATION>

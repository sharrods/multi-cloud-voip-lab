# nginx settings for the Poly provisioning server (runs on the laptop).
#   - Serves ./configs to the phone, download only
#   - Requires the login in .htpasswd (HTTP basic authentication)
#   - Accepts phone log uploads (/logs/) and phone-side setting changes (/overrides/)
#   - Prints one line per phone request: docker compose logs -f

user  nginx;
worker_processes  1;

error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  64;
}

http {
    log_format  provisioning  '$time_local  $remote_addr  "$request"  '
                              'status=$status  bytes=$body_bytes_sent  '
                              'user=$remote_user  agent="$http_user_agent"';
    access_log  /dev/stdout  provisioning;

    sendfile        on;
    server_tokens   off;
    default_type    application/octet-stream;

    server {
        listen       80;
        server_name  _;

        root  /srv/provisioning;
        autoindex  off;

        auth_basic            "Poly lab provisioning";
        auth_basic_user_file  /etc/nginx/.htpasswd;

        location / {
            limit_except GET HEAD {
                deny all;
            }
        }

        location /logs/ {
            alias  /srv/phone-logs/;
            dav_methods           PUT;
            create_full_put_path  on;
            dav_access            user:rw group:rw all:r;
            client_max_body_size  20m;
            limit_except GET HEAD PUT {
                deny all;
            }
        }

        location /overrides/ {
            alias  /srv/phone-overrides/;
            dav_methods           PUT;
            create_full_put_path  on;
            dav_access            user:rw group:rw all:r;
            client_max_body_size  5m;
            limit_except GET HEAD PUT {
                deny all;
            }
        }
    }
}
